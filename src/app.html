<!doctype html>
<html lang="id">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<link rel="preconnect" href="https://fonts.googleapis.com">
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
		<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800;900&display=swap" rel="stylesheet">
		<link rel="icon" type="image/png" href="/favicon.png" />
		<style>
			/* Completely hide Google Translate top banner bar and popups */
			.goog-te-banner-frame,
			.goog-te-banner-frame.skiptranslate,
			iframe.goog-te-banner-frame,
			iframe.skiptranslate,
			.VIpgJd-ZVi9od-aZ2wEe-wOHMyf,
			.VIpgJd-ZVi9od-aZ2wEe-wOHMyf-ti6hGc,
			.VIpgJd-ZVi9od-xl07Ob-OEVmcd,
			#goog-gt-tt,
			.goog-te-balloon-frame {
				display: none !important;
				visibility: hidden !important;
				height: 0 !important;
				width: 0 !important;
				opacity: 0 !important;
				pointer-events: none !important;
			}
			body {
				top: 0px !important;
				position: static !important;
			}
			.goog-text-highlight {
				background: transparent !important;
				box-shadow: none !important;
			}
			#google_translate_element {
				display: none !important;
			}
		</style>
		%sveltekit.head%
	</head>
	<body class="bg-black text-white font-sans antialiased selection:bg-[#FFE500] selection:text-black" data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
